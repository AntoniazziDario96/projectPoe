<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments :: head(${currencyPage} ? #{nav.currency} : #{nav.uniques})}"></head>
<body>
<header th:replace="~{fragments :: header(${currencyPage} ? 'currency' : 'uniques')}"></header>
<main>
    <h1 th:text="${currencyPage} ? #{movers.currencyHeading} : #{nav.uniques}">Currency</h1>

    <div class="filters">
        <span class="muted small" th:text="#{movers.period}">Periodo:</span>
        <a class="btn small" th:classappend="${period != 'day'} ? 'secondary'"
           th:href="${currencyPage} ? @{/currency(period='day')} : @{/uniques(period='day')}" th:text="#{common.24h}">24 ore</a>
        <a class="btn small" th:classappend="${period != 'week'} ? 'secondary'"
           th:href="${currencyPage} ? @{/currency(period='week')} : @{/uniques(period='week')}" th:text="#{common.7d}">7 giorni</a>
        <span class="muted small" th:if="${snapshot != null}" th:text="#{movers.updated(${@fmt.ago(snapshot.fetchedAt)})}"></span>
    </div>

    <div class="notice" th:if="${!league.hasEconomy()}" th:text="#{common.noEconomy}"></div>
    <div class="notice" th:if="${league.hasEconomy() and snapshot == null}" data-auto-reload="5000" th:text="#{common.loadingPrices}"></div>
    <div class="notice error" th:if="${snapshot != null and snapshot.error != null}">
        <span th:text="#{movers.partialError}"></span> <span th:text="${snapshot.error}"></span>
    </div>

    <div class="notice" th:if="${snapshot != null and up.isEmpty() and down.isEmpty()}" th:text="#{movers.noChanges}"></div>

    <p class="small muted" th:if="${snapshot != null}" th:text="#{movers.note}"></p>

    <div class="grid two" th:if="${snapshot != null}">
        <section class="card" th:each="block : ${ {'up', 'down'} }">
            <h3 th:text="${block == 'up'} ? #{movers.up} : #{movers.down}">In crescita</h3>
            <div class="table-wrap">
                <table>
                    <thead><tr><th th:text="#{common.item}">Oggetto</th><th class="right" th:text="#{common.price}">Prezzo</th><th class="right" th:text="#{movers.change}">Variazione</th><th th:text="#{common.history30}">Storico 30 gg</th></tr></thead>
                    <tbody>
                    <tr th:each="l : ${block == 'up' ? up : down}" th:with="key=${l.links != null ? l.name + ' (' + l.links + 'L)' : l.name}">
                        <td>
                            <span class="item-name">
                                <img class="icon" th:if="${l.icon != null}" th:src="${l.icon}" alt="" loading="lazy">
                                <span th:classappend="${l.isUnique()} ? 'unique-name'" th:text="${l.name}">Nome</span>
                            </span>
                            <a th:replace="~{fragments :: wiki(${l.name})}"></a>
                            <a class="wiki" th:if="${tradeUrls.get(key) != null}" th:href="${tradeUrls.get(key)}" target="_blank" rel="noopener">trade</a>
                            <br><span class="muted small" th:text="${@fmt.category(l.category)} + ' · ' + (${l.volumeBased} ? #{movers.volume(${@fmt.chaos(l.listings * 1.0)})} : #{movers.listings(${l.listings})})"></span>
                            <span class="pill warn" th:if="${l.lowConfidence}" th:text="#{common.lowData}">pochi dati</span>
                        </td>
                        <td class="right nowrap" th:text="${@fmt.price(l.chaos, divinePrice)}"></td>
                        <td class="right"><span th:replace="~{fragments :: change(${period == 'week' ? l.change7d : l.change24h})}"></span></td>
                        <td>
                            <svg class="spark" viewBox="0 0 100 30" th:if="${!#strings.isEmpty(spark.get(key))}" aria-hidden="true">
                                <polyline th:attr="points=${spark.get(key)}"></polyline>
                            </svg>
                            <span class="muted small" th:if="${#strings.isEmpty(spark.get(key))}" th:text="#{movers.collecting}">in raccolta</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
